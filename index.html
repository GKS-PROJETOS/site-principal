<script>
  (function () {
    var hero = document.querySelector('.hero');
    var img = new Image();
    var feito = false;
    function mostra() { if (!feito) { feito = true; hero.classList.add('hero--pronta'); } }
    img.src = matchMedia('(max-width: 480px)').matches ? 'assets/hero-mobile.webp?v=20261113' : 'assets/hero.webp?v=20261113';
    if (img.complete) hero.classList.add('hero--sem-fade');   /* ja estava no cache: sem animacao */
    if (img.decode) img.decode().then(mostra, mostra); else { img.onload = img.onerror = mostra; }
    setTimeout(mostra, 15000);   /* rede travada: desiste de esperar e deixa o navegador desenhar */
  })();
</script>

<script>
  // Quem abriu a escolha pela vitrine volta para o mesmo ponto da pagina;
  // quem chegou pelo link direto (/#contato) so fecha a tela.
  var veioDaVitrine = false;
  document.querySelector('[data-abre-contato]').addEventListener('click', function () { veioDaVitrine = true; });
  document.querySelector('[data-fecha-contato]').addEventListener('click', function (e) {
    e.preventDefault();
    if (veioDaVitrine) { veioDaVitrine = false; history.back(); }
    else { history.replaceState(null, '', location.pathname + location.search); document.getElementById('contato').classList.add('escolha--fechada'); }
  });
  window.addEventListener('hashchange', function () { document.getElementById('contato').classList.remove('escolha--fechada'); });
</script>
